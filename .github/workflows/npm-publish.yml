on:
    push:
        branches: main
permissions:
    id-token: write # Required for OIDC
    contents: read
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 'lts/*'
            - uses: JS-DevTools/npm-publish@v4
